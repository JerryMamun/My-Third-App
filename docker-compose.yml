version: "3.9"

services:
  # ─────────────────────────────────────────
  # PostgreSQL Primary
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bluebird-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluebird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluebird_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-bluebird}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluebird -d bluebird"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # Redis (Caching + Sessions + Queue)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bluebird-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-bluebird_redis_2026}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # Next.js Web Application
  # ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bluebird-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bluebird:bluebird_dev_2026@postgres:5432/bluebird}
      REDIS_URL: ${REDIS_URL:-redis://:bluebird_redis_2026@redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # API Gateway (Fastify)
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bluebird-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bluebird:bluebird_dev_2026@postgres:5432/bluebird}
      REDIS_URL: ${REDIS_URL:-redis://:bluebird_redis_2026@redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MIKROTIK_SERVICE_URL: ${MIKROTIK_SERVICE_URL:-http://mikrotik:4001}
      MONITORING_SERVICE_URL: ${MONITORING_SERVICE_URL:-http://monitoring:4002}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notifications:4003}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID}
      SSLCOMMERZ_STORE_PASS: ${SSLCOMMERZ_STORE_PASS}
      BKASH_APP_KEY: ${BKASH_APP_KEY}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID}
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # MikroTik Integration Service
  # ─────────────────────────────────────────
  mikrotik:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: services/mikrotik
    container_name: bluebird-mikrotik
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bluebird:bluebird_dev_2026@postgres:5432/bluebird}
      REDIS_URL: ${REDIS_URL:-redis://:bluebird_redis_2026@redis:6379}
      SERVICE_PORT: 4001
      MIKROTIK_ENCRYPTION_KEY: ${MIKROTIK_ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # Monitoring Service (ONU/GPON)
  # ─────────────────────────────────────────
  monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: services/monitoring
    container_name: bluebird-monitoring
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bluebird:bluebird_dev_2026@postgres:5432/bluebird}
      REDIS_URL: ${REDIS_URL:-redis://:bluebird_redis_2026@redis:6379}
      SERVICE_PORT: 4002
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      OLT_POLL_INTERVAL_MS: ${OLT_POLL_INTERVAL_MS:-30000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────
  notifications:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: services/notifications
    container_name: bluebird-notifications
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://bluebird:bluebird_dev_2026@postgres:5432/bluebird}
      REDIS_URL: ${REDIS_URL:-redis://:bluebird_redis_2026@redis:6379}
      SERVICE_PORT: 4003
      SMS_GATEWAY_API_KEY: ${SMS_GATEWAY_API_KEY}
      SMS_GATEWAY_SECRET: ${SMS_GATEWAY_SECRET}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bluebird-network

  # ─────────────────────────────────────────
  # Nginx Reverse Proxy (Production)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bluebird-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - bluebird-network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  bluebird-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
